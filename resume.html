<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>

         body {
            background: #637474;
            margin: 8px;
            nav {
            text-align: center;
            margin-bottom: 20px;
        }
        nav li {
            list-style: none;
            display: inline-block;
            margin: 10px;
            margin-top: 30px;
        }
        nav li a {
            text-decoration: none;
            font-size: 18px;
            color: white;
            font-weight: bold;
            position: relative;
            margin-left: 1100px;
        }
        nav li a::after {
            content: '';
            width: 0;
            height: 3px;
            background: rgba(236, 182, 5, 0.952);
            position: absolute;
            left: 0;
            bottom: -6px;
            transition: 0.3s;
        }
        nav li a:hover::after {
            width: 100%;
        }

        .sub-title{
            margin-left: 601px;
            display: inline-block;
            position: relative;
            padding-bottom: 5px;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
        .sub-title::after {
         content: '';
         width: 100%;
         height: 3px;
         position: absolute;
         left: 0;
         bottom: 0;
         background: linear-gradient(to right, orange, black); /* Gradient colors */
        }
        .work-list{
        margin-top: 20px;
        
        }
        .work{
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .work img{
            margin-left: 532px;
            width: 20%;
            display: block;
            border-radius: 10px;
            transition: transform 0.5s;
        }

        .layer {
            width: 22%;
            height: 0%;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(88, 5, 243, 0.719));
            position: absolute;
            left: 38.63%;
            bottom: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            transition: height 0.5s;
        }
        .layer a{
            color: black;
            text-decoration: none;
            font-size: 15px;
            background: orangered;
            border-radius: 10%;
            display: inline-block;
            margin-top: 30px;
            padding: 0% 10px;
            transition: transform 0.5s;
        }
        .layer a:hover {
            color: whitesmoke;
            transform: translateY(-7px);
        }

        .work:hover img{
            transform: scale(1.1);
        }
        .work:hover .layer{
            height: 100%;    
        }
        .download a{
            color: black;
            text-decoration: none;
            font-size: 30px;
            font-weight: 500;
            background: orangered;
            border-radius: 15%;
            display: inline-block;
            margin-top: 30px;
            margin-left: 586px;
            padding: 5px 15px;
            transition: transform 0.5s;
        }
        .download a:hover {
            color: whitesmoke;
            transform: translateY(-7px);
        }

        @media (max-width: 600px) {
            nav li a{
                margin-left: 6px;
            }
            .sub-title {
                font-size: 24px;
                margin-left: 140px;
                margin-top: 10px;
            }
            .work img, .layer {
                width: 80%;
                margin-left: 36px;
            }
            .download a {
                font-size: 18px;
                padding: 8px 15px;
                margin-left: 125px
            }
            .layer{
                left: -14.5px;
                width: 88%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <li><a href="index.html">Homepage</a></li>
    </nav>
    <h1 class="sub-title">Resume</h1>
    <div class="work-list">
        <div class="work">
            <img src="Rishav Mondal_SE_Resume_Photo.jpg" alt="Resume">
            <div class="layer">
                <a href="Rishav Mondal_SE_Resume.pdf" target="_blank"><h2>View</h2></a>
            </div>
        </div>
    </div>
    <div class="download">
        <a href="Rishav Mondal_SE_Resume.pdf" download="Rishav Mondal_SE_Resume"><b>Download</b></a>
    </div>
    
</body>
</html>
