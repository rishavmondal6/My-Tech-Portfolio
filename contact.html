<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <style>
        body {
            background: #637474;
            margin: 8px;
        }

        nav {
            text-align: center;
            margin-bottom: 20px;
        }

        nav li {
            list-style: none;
            display: inline-block;
            margin: 10px;
            margin-top: 30px;
        }

        nav li a {
            text-decoration: none;
            font-size: 18px;
            color: white;
            font-weight: bold;
            position: relative;
            margin-left: 1100px;
        }

        nav li a::after {
            content: '';
            width: 0;
            height: 3px;
            background: rgba(236, 182, 5, 0.952);
            position: absolute;
            left: 0;
            bottom: -6px;
            transition: 0.3s;
        }

        nav li a:hover::after {
            width: 100%;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-left: 100px;
        }

        .contact-left {
            flex-basis: 40%;
            margin-top: 8%;
            margin-left: 40px;
        }

        .contact-right {
            flex-basis: 50%;
            margin-top: 4%;
        }

        .contact-left p {
            font-weight: 700;
            font-size: 155%;
            margin-top: 30px;
        }
        .contact-left p a{
            text-decoration: none;
            color: rgb(238, 229, 229);
        }
        .contact-left p a:hover{
            color: rgb(238, 10, 10);
        }

        .contact-left u {
            color: blanchedalmond;
        }

        .social-icons a {
            color: whitesmoke;
            text-decoration: none;
            font-size: 23px;
            background: black;
            border-radius: 10%;
            display: inline-block;
            margin-top: 30px;
            padding: 5px 10px;
            transition: transform 0.5s;
        }

        .social-icons a:hover {
            color: red;
            transform: translateY(-7px);
        }

        .contact-right form {
            width: 80%;
        }

        form input, form textarea {
            width: 90%;
            border: 0;
            outline: none;
            background: #262626;
            padding: 13px;
            margin: 10px 0;
            color: #fff;
            font-size: 18px;
            border-radius: 6px;
        }

        form button {
            width: 100px;
            background:whitesmoke;
            color: black;
            font-size: 18px;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 15px;
            transition: background 0.3s;
        }

        form button:hover {
            background: aquamarine;
        }

        #msg {
            color: black;
            font-size: 16px;
            margin-top: -64px;
            display: block;
        }
        @media (max-width: 600px){
            nav li a{
                margin-left: 6px;
            }
            .contact-left, .contact-right{
                flex-basis: 100%;
            }
            .contact-left{
                margin-left: -80px;
                margin-top: -20px;
                font-size: 10px;
            }
            .social-icons a{
                font-size: 16px;
            }
            form input, form textarea{
                width: 120%;
                margin-left: -59px;
                margin-top: 8px;
            }
            form button{
                margin-left: -59px;
                width: 40%;
            }
            #msg{
                margin-left: -20%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <li><a href="index.html">Homepage</a></li>
    </nav>

    <div id="contact">
        <div class="container">
            <div class="row">
                <div class="contact-left">
                    <h1 class="sub-title"><u>Contact Me</u></h1>
                    <p>Email - <a href="https://mail.google.com/mail/?view=cm&fs=1&to=mondalrishav80@gmail.com" target="_blank">mondalrishav80@gmail.com</a></p>
                    <p>Phone No.- <a href="tel:9039069394">9039069394</a> / <a href="tel:8240152497">8240152497</a></p>
                    <div class="social-icons">
                        <a href="https://www.linkedin.com/in/rishav-mondal/"><b>LinkedIn</b></a>
                        <a href="https://github.com/rishavmondal6"><b>Github</b></a>
                        <a href="https://www.facebook.com/share/15WSQG61bC/"><b>Facebook</b></a>
                    </div>
                </div>
                <div class="contact-right">
                    <form name="submit-to-google-sheet">
                        <input type="text" name="Name" placeholder="Your Name" required>
                        <input type="email" name="Email" placeholder="Your Email" required>
                        <input type="text" name="Phone" placeholder="Your Phone No." required>
                        <textarea name="Subject" rows="1" placeholder="Your Subject"></textarea>
                        <textarea name="Message" rows="5" placeholder="Your Message"></textarea>
                        <button type="submit"><b>Submit</b></button>
                    </form>
                    <span id="msg"></span>
                </div>
            </div>
        </div>  
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyxI6vZyOI9-6hFtOH3HVGR1vWhC6_84ue62LR676Wa3lXWLkMAN7j5vpLsC25SFyxc/exec';
        const form = document.forms['submit-to-google-sheet'];
        const msg = document.getElementById("msg");

        form.addEventListener('submit', e => {
            e.preventDefault();
            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    msg.innerHTML = "<b>Message sent successfully.</b>";
                    setTimeout(() => {
                        msg.innerHTML = "";
                        form.reset();
                    }, 5000);
                })
                .catch(error => console.error('Error!', error.message));
        });
    </script>
</body>
</html>
